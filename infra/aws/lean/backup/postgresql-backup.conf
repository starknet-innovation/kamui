# Included in the PostgreSQL server configuration by the lean Compose service.
# Never disable fsync/full_page_writes/synchronous_commit to make backup tests pass.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=kamui archive-push %p'
# Attempt a segment switch during activity; not a guaranteed recovery-point objective.
archive_timeout = 60
fsync = on
full_page_writes = on
synchronous_commit = on
