# Read-only Terraform plan of github-oidc, the module that defines this repository's own AWS
# access, in both test accounts, run through OIDC. No AWS access key is stored in GitHub; each job
# exchanges its GitHub token for a short-lived session of the read-only plan role.
#
# Nothing here applies. github-oidc is applied by an operator, never by CI, because it defines
# CI's own access (infra/aws/terraform/github-oidc/README.md). The backend/ and pepper/ root
# modules describe the retired Fargate design and are not planned: the live Sepolia deployment is
# the operator-run lean package (infra/aws/lean). A plan that is not "No changes" means the live
# roles drifted from this tree, or this tree changes them and an operator still has to apply it.
#
# Account-specific values (account ids, state buckets, the protected pepper key ARN) come from
# repository variables, never from committed files.

name: terraform

on:
  pull_request:
    paths: ['infra/aws/terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: eu-west-1

jobs:
  plan:
    name: plan (github-oidc, ${{ matrix.account }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required to request the OIDC token
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: backend
            release_repository_names: '["kamui-sepolia/keychain","kamui-sepolia/backend","kamui-sepolia/pepper","kamui-sepolia/postgres","kamui-sepolia/caddy"]'
          - account: pepper
            release_repository_names: '[]'
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/aws/terraform

      - uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ matrix.account == 'backend' && vars.AWS_BACKEND_PLAN_ROLE_ARN || vars.AWS_PEPPER_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Plan
        working-directory: infra/aws/terraform/github-oidc
        env:
          STATE_BUCKET: ${{ matrix.account == 'backend' && vars.AWS_BACKEND_STATE_BUCKET || vars.AWS_PEPPER_STATE_BUCKET }}
          TF_VAR_aws_account_id: ${{ matrix.account == 'backend' && vars.AWS_BACKEND_ACCOUNT_ID || vars.AWS_PEPPER_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_service: ${{ matrix.account }}
          TF_VAR_github_repository: ${{ github.repository }}
          # This repository uses GitHub's immutable OIDC subjects (owner and repository ids).
          TF_VAR_github_immutable_subject_prefix: repo:starknet-innovation@258895906/kamui@1455036596
          TF_VAR_apply_environment: aws-${{ matrix.account }}-apply
          TF_VAR_state_bucket_name: ${{ matrix.account == 'backend' && vars.AWS_BACKEND_STATE_BUCKET || vars.AWS_PEPPER_STATE_BUCKET }}
          TF_VAR_release_repository_names: ${{ matrix.release_repository_names }}
          TF_VAR_protected_kms_key_arns: ${{ matrix.account == 'pepper' && vars.AWS_PEPPER_PROTECTED_KMS_KEY_ARNS || '[]' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.account }}" = pepper ] && [ "$TF_VAR_protected_kms_key_arns" = '[]' ]; then
            echo "Set the repository variable AWS_PEPPER_PROTECTED_KMS_KEY_ARNS (a JSON list) first." >&2; exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=github-oidc/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          # The plan role cannot write anything. A failure here is a plan that needs a permission
          # the role lacks: read the error, do not widen the role to make it pass.
          terraform plan -input=false -lock=false -detailed-exitcode -no-color > plan.txt || code=$?
          {
            echo "### terraform plan — github-oidc (${{ matrix.account }} account)"
            echo '```'
            sed -E 's/[0-9]{12}/<account>/g' plan.txt | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f plan.txt
          case "${code:-0}" in
            0) echo "No changes: the live roles match this tree." ;;
            2) echo "::warning::Changes pending: an operator must review and apply github-oidc in the ${{ matrix.account }} account." ;;
            *) exit "$code" ;;
          esac
