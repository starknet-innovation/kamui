# Local PostgreSQL only. Not an EC2 deployment or a backup configuration.
# Set POSTGRES_PASSWORD privately in .env.local; never commit the value.
# docker compose --env-file .env.local -f compose.postgres.yml up -d
name: kamui-postgres
services:
  postgres:
    # Development tag; pin a reviewed digest in the later hosted deployment.
    image: postgres:16
    environment:
      POSTGRES_DB: kamui
      POSTGRES_USER: kamui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kamui -d kamui"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
