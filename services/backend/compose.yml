# Backend services. From this directory:
#   docker compose --env-file .env.local up -d --build
# --env-file lets ${RPC_URL} below reach the prover without handing it the other secrets.
# Each service's Dockerfile sits next to its code and starts it through a `service:*` script.
name: social
services:
  api:
    build: { context: ., dockerfile: src/services/api/Dockerfile }
    env_file: .env.local
    environment:
      PROVER_URL: http://prover:9900
      ROTATOR_URL: http://rotator:3001
    # Kamui: 3000 only. The metrics port (9464) is deliberately not published.
    ports: ["3000:3000"]
    # Kamui: session registry and durable recovery metadata share this private data volume.
    # REGISTRY_DB defaults to /app/data/registry.sqlite; recovery.sqlite is beside it.
    volumes: ["registry-data:/app/data"]
    restart: unless-stopped

  rotator:
    build: { context: ., dockerfile: src/services/rotator/Dockerfile }
    env_file: .env.local
    # Loopback only: lets `bun run service:api` on this machine read its /health.
    ports: ["127.0.0.1:3001:3001"]
    restart: unless-stopped

  # Kamui: checks every key written to the registry against the issuers (plan D8). It gets the
  # RPC URL and nothing else: no key. In production run it apart from the rotator, under another
  # identity; it is here so a local stack has one.
  watcher:
    build: { context: ., dockerfile: src/services/watcher/Dockerfile }
    environment:
      RPC_URL: ${RPC_URL}
      WATCHER_WEBHOOK_URL: ${WATCHER_WEBHOOK_URL:-}
    restart: unless-stopped

  prover:
    build: { context: ., dockerfile: src/services/prover/Dockerfile }
    environment:
      RPC_URL: ${RPC_URL}
      CHAIN_ID: SN_SEPOLIA
      # Logs each proving phase with its timing, worth keeping.
      RUST_LOG: warn,starknet_transaction_prover=debug,privacy_prove=info,stwo_cairo_adapter=info,stwo_cairo_prover=info
    # Loopback only: lets `bun run service:api` on this machine reach it; nothing outside can.
    ports: ["127.0.0.1:9900:9900"]
    # Kamui: the prover image current on 2026-11-12 is OOM-killed at upstream's 8 GB cap five
    # seconds into a proof, and peaked at 19.5 GB (including file cache) under a 20 GB cap. The
    # true need is somewhere between; see spikes/s1/results/RESULTS.md. One proof at a time.
    mem_limit: 20g
    restart: unless-stopped

volumes:
  registry-data:
